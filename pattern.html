<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF5FF">
<title>영어회화 패턴 · Sunny</title>
<style>
  /* ───────── v4 가벼운 화면 (2026-10-27) ─────────
     · 인터넷 글꼴을 받지 않고 태블릿 기본 글꼴 사용 · 계속 움직이는 효과(회전·깜빡임·맥박) 없앰 · 큰 그림자·배경 그라데이션 줄임
     색마다 뜻: 주황=시작/다음, 초록=정답/완료, 노랑=별, 하늘=듣기, 보라=Pass Test, 산호=말하기 */
  :root{
    --bg:#EEF5FF; --card:#fff; --ink:#1F2A44; --muted:#66748F; --line:#E1E8F5; --soft:#EEF4FF;
    --orange:#FF8A3D; --orange2:#E2691A; --mint:#22B573; --mint2:#16935B; --sun:#FFC93C;
    --sky:#3B82F6; --sky2:#2563EB; --grape:#7C5CFF; --grape2:#5B3DE0; --coral:#FF5C6A; --coral2:#DE3A48;
    --teal:#14B8A6; --teal2:#0E8F81; --warn:#E08A00; --bad:#E5484D;
    --r:22px; --fs:21px; --btn:64px;
  }
  @media (max-width:700px){ :root{ --fs:17px; --btn:56px; --r:18px; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:var(--fs);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  .wrap{max-width:1180px;margin:0 auto;padding:12px 18px 24px;min-height:100vh;display:flex;flex-direction:column}
  .en{letter-spacing:.1px}
  .hidden{display:none!important}
  .sm{font-size:.78em}
  .muted{color:var(--muted)}
  button{font-family:inherit;color:inherit}
  b{font-weight:800}

  /* 상단 바 */
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800}
  .top .sp{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:.8em;white-space:nowrap}
  .chip.star{background:#FFF4CC;border-color:#FFE29A;color:#7a5000}
  .iconbtn{border:1px solid var(--line);background:#fff;border-radius:16px;min-width:54px;height:54px;font-size:1.15em;cursor:pointer;padding:0 14px;font-weight:800}
  .iconbtn.off{opacity:.5}
  .iconbtn.on{background:#FFF1E4;border-color:#FDBA74}

  .card{background:var(--card);border-radius:var(--r);padding:20px 22px;border:1px solid var(--line);margin-bottom:14px}
  h2{margin:0 0 14px;font-size:1.15em;font-weight:800;display:flex;align-items:center;gap:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .tile{border:3px solid var(--line);border-bottom-width:6px;border-radius:20px;background:#fff;font-size:1em;font-weight:800;cursor:pointer;padding:14px 12px;min-height:var(--btn);text-align:center}
  .tile:active{transform:translateY(3px);border-bottom-width:3px;border-color:var(--orange);background:#FFF4EA}
  .tile small{display:block;color:var(--muted);font-weight:600;font-size:.72em;margin-top:4px}
  .tile .av{font-size:2.1em;line-height:1.1;display:block;margin-bottom:4px}
  .grid.names{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .grid.names .tile{padding:10px 6px;min-height:0}
  .grid.names .tile .av{font-size:1.7em;margin-bottom:2px}
  .grid.names .tile small{display:block;font-size:.68em;color:var(--muted);font-weight:600;margin-top:2px}
  .initials{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .initials button{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:#fff;min-width:48px;height:46px;font-weight:800;font-size:.95em;cursor:pointer;padding:0 10px}
  .initials button.on{background:var(--orange);border-color:#E2691A;color:#fff}
  .initials button:disabled{opacity:.3;cursor:default}
  .codewrap{max-width:380px;margin:0 auto;text-align:center}
  .codewho{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.25em;margin-bottom:6px}
  .codewho .av{font-size:1.6em}
  .dots{display:flex;justify-content:center;gap:14px;margin:14px 0}
  .dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:#fff}
  .dots i.on{background:var(--orange);border-color:#E2691A}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .keypad button{border:3px solid var(--line);border-bottom-width:6px;border-radius:18px;background:#fff;font-size:1.5em;font-weight:800;height:66px;cursor:pointer;font-family:inherit}
  .keypad button:active{transform:translateY(3px);border-bottom-width:3px}
  .keypad button.fn{font-size:1.05em;color:var(--muted)}
  .codemsg{min-height:1.5em;margin-top:10px;font-weight:800;color:var(--bad)}
  .tile.sel{border-color:var(--orange);background:#FFF4EA}
  .dbar{height:12px;border-radius:6px;background:#FFE0E3;margin:14px auto 0;max-width:380px;overflow:hidden}
  .dbar i{display:block;height:100%;background:var(--coral);width:0}

  /* 버튼: 아래가 두꺼운 버튼(그림자 흐림 없이 → 가벼움) */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--btn);padding:0 24px;border:0;border-radius:18px;font-size:1em;font-weight:800;cursor:pointer;color:#fff;background:var(--orange);box-shadow:0 5px 0 var(--orange2)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange2)}
  .btn.gray{background:#fff;color:var(--ink);box-shadow:0 5px 0 #D7DEEB;border:2px solid #E6EBF5}
  .btn.gray:active{box-shadow:0 1px 0 #D7DEEB}
  .btn.green{background:var(--mint);box-shadow:0 5px 0 var(--mint2)}
  .btn.green:active{box-shadow:0 1px 0 var(--mint2)}
  .btn.blue{background:var(--sky);box-shadow:0 5px 0 var(--sky2)}
  .btn.blue:active{box-shadow:0 1px 0 var(--sky2)}
  .btn.purple{background:var(--grape);box-shadow:0 5px 0 var(--grape2)}
  .btn.purple:active{box-shadow:0 1px 0 var(--grape2)}
  .btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral2)}
  .btn.wide{width:100%}
  .btn.bye{background:#fff;color:var(--ink);border:3px solid var(--coral);box-shadow:0 5px 0 #F3B3B9;min-height:66px;font-size:1.05em;flex-direction:row;gap:10px}
  .btn.bye span{font-size:1.5em;line-height:1}
  .btn.bye small{display:block;font-size:.72em;font-weight:600;color:var(--muted)}
  .btn.bye:active{box-shadow:0 1px 0 #F3B3B9}
  .navrow .btn.bye{min-height:var(--btn);font-size:.95em;border-width:2px}
  .navrow .btn.bye small{display:none}
  .btn:disabled{opacity:.4;cursor:default;transform:none}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .row>.btn{flex:1}

  /* ───────── Sunny (움직이지 않는 그림 · 표정만 바뀜) ───────── */
  .sunny{display:inline-block;overflow:visible;vertical-align:middle}
  .sunny .shut,.sunny .mouth-open,.sunny .mouth-flat,.sunny .mouth-o,.sunny .brow{display:none}
  .sunny.cheer .eye,.sunny.cheer .mouth-smile{display:none}
  .sunny.cheer .shut,.sunny.cheer .mouth-open{display:block}
  .sunny.talk .mouth-smile{display:none}.sunny.talk .mouth-open{display:block}
  .sunny.think .mouth-smile{display:none}.sunny.think .mouth-flat,.sunny.think .brow{display:block}
  .sunny.oops .mouth-smile,.sunny.listen .mouth-smile{display:none}
  .sunny.oops .mouth-o,.sunny.listen .mouth-o{display:block}
  .bubble-sun{position:relative;background:#FFF8DF;border:2px solid #FFE08A;border-radius:16px;padding:10px 14px;font-weight:700;font-size:.85em;margin-top:12px;line-height:1.45}

  /* ───────── 반·이름 ───────── */
  .greet{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .greet h2{margin:0}

  /* ───────── 홈 ───────── */
  .home{display:grid;grid-template-columns:1.25fr .95fr;gap:16px;align-items:start}
  @media (max-width:860px){ .home{grid-template-columns:1fr} }
  .hero{position:relative;background:#FF8A3D;color:#fff;border-radius:var(--r);padding:20px 22px;cursor:pointer;display:flex;gap:14px;align-items:center;margin-bottom:14px;box-shadow:0 6px 0 #E2691A}
  .hero:active{transform:translateY(4px);box-shadow:0 2px 0 #E2691A}
  .hero .lab{font-weight:700;font-size:.8em;opacity:.95}
  .hero .pat{font-weight:800;font-size:1.65em;margin:6px 0 2px;line-height:1.2}
  .hero .ko{font-weight:600;opacity:.95}
  .hero .qa{margin-top:10px;background:rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;font-weight:700;font-size:.82em;line-height:1.5}
  .hero .qa b{display:inline-block;min-width:1.4em}
  .hero .go{margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#D9600F;border-radius:14px;padding:11px 18px;font-weight:800}
  .tchip{display:inline-block;background:#fff;color:#7a3a00;border-radius:999px;padding:2px 10px;font-size:.9em;margin-left:4px}
  .passcard{background:#F1ECFF;border:2px solid #CDBEFF;cursor:pointer;display:flex;gap:14px;align-items:center}
  .passcard:active{transform:translateY(2px)}
  .passcard .e{font-size:2.4em}
  .passcard b{display:block;font-size:1.05em;color:var(--grape2)}
  .goal{padding:16px 20px}
  .goal-row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;margin-bottom:12px}
  .goal-item{background:#F6F9FF;border-radius:16px;padding:12px 10px;text-align:center}
  .goal-item .v{font-weight:800;font-size:1.25em;line-height:1.15}
  .goal-item .l{color:var(--muted);font-weight:600;font-size:.72em;margin-top:2px}
  .goal-item.hot{background:#FFE8DD}
  .goal-item.done{background:#E3F8EC}
  .week{display:flex;gap:6px;justify-content:center;margin:4px 0 2px}
  .week i{width:26px;height:26px;border-radius:50%;background:#E3E9F5;display:grid;place-items:center;font-style:normal;font-size:.6em;font-weight:800;color:#8a93ab}
  .week i.on{background:var(--mint);color:#fff}
  .week i.today{outline:3px solid var(--orange);outline-offset:1px}
  .bar{height:16px;border-radius:8px;background:#E6EBF5;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--mint);border-radius:8px}
  .rv{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .rv button{border:2px solid #FFE08A;border-bottom-width:4px;background:#FFF8DF;border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:.8em}
  .me{display:flex;align-items:center;gap:14px;padding:16px 20px}
  .avatar{width:80px;height:80px;border-radius:26px;background:#FFE7B8;display:grid;place-items:center;font-size:2.4em;flex:none}
  .me .name{font-weight:800;font-size:1.25em}
  .lvbadge{display:inline-block;padding:4px 12px;border-radius:10px;background:var(--soft);color:var(--sky2);font-weight:800;font-size:.75em;margin:4px 4px 0 0}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .mbtn{border:0;border-radius:20px;padding:18px 8px 16px;font-weight:800;font-size:.95em;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
  .mbtn span{font-size:2.1em;line-height:1.1}
  .mbtn small{font-weight:600;font-size:.72em;opacity:.92}
  .mbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .mbtn.chat{background:var(--coral)}.mbtn.drill{background:var(--teal)}

  /* ───────── 학습 화면 ───────── */
  .lhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .steps{display:flex;gap:6px;flex:1}
  .stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .stp i{width:100%;height:12px;border-radius:6px;background:#D8E0F0;display:block}
  .stp b{font-size:.74em;color:#8a93ab;font-weight:700;white-space:nowrap}
  .stp.on i{background:var(--orange)}.stp.on b{color:#D9600F}
  .stp.done i{background:var(--mint)}.stp.done b{color:var(--mint2)}
  .timer{font-weight:800;min-width:88px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.9em}
  .timer.low{background:#FFE8DD;color:#b8420f}
  .learn{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
  @media (max-width:900px){ .learn{grid-template-columns:1fr} .lside{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center} .lside .bubble-sun,.lside .play.wide{grid-column:1/-1} }
  .lside{padding:18px}
  .pat-title{font-weight:800;font-size:1.4em;line-height:1.2;margin-top:2px}
  .pat-ko{color:var(--muted);margin-top:4px;font-weight:600}
  .play.wide{width:100%;height:56px;border-radius:16px;font-size:.9em;font-weight:800;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
  .lmain{min-height:420px}
  .stepname{display:inline-block;background:#FFF1E4;color:#D9600F;font-weight:800;border-radius:12px;padding:6px 14px;font-size:.82em;margin-bottom:10px}
  .say{display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .say.ok{border-color:#A9E8C6;background:#F4FCF7}
  .say .pic{font-size:2.1em;width:58px;text-align:center;flex:none}
  .say .txt{flex:1;min-width:0}
  .say .s{font-weight:800;font-size:1.2em;line-height:1.3}
  .say .k{color:var(--muted);font-size:.78em;font-weight:600}
  .say .q{color:var(--sky2);font-weight:700;font-size:.82em;margin-bottom:2px}
  .play{border:0;background:#E4F0FF;color:var(--sky2);width:60px;height:60px;border-radius:18px;font-size:1.35em;cursor:pointer;flex:none;box-shadow:0 4px 0 #BBD4F7}
  .play:active{transform:translateY(3px);box-shadow:0 1px 0 #BBD4F7}
  .play.sm{width:44px;height:44px;font-size:1em;border-radius:14px;vertical-align:middle}
  .mic{border:0;width:60px;height:60px;border-radius:50%;font-size:1.35em;cursor:pointer;flex:none;color:#fff;background:var(--coral);box-shadow:0 4px 0 var(--coral2)}
  .mic:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral2)}
  .mic.on{background:#D92D20;box-shadow:0 0 0 6px rgba(255,92,106,.35)}
  .mine{border:0;background:#EEF1F7;width:60px;height:60px;border-radius:18px;font-size:1.25em;cursor:pointer;flex:none;box-shadow:0 4px 0 #D0D7E5}
  .mine:disabled{opacity:.35}
  .result{min-height:56px;margin-top:12px;font-weight:700}
  .w{display:inline-block;padding:0 4px;border-radius:7px}
  .w.g{background:#D4F5E3}.w.y{background:#FFF0B8}.w.r{background:#FFD9DC}
  .slot{color:#D9600F;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:5px;text-decoration-color:#FFC93C}
  .blank{color:#D9600F;font-weight:800}

  /* Q&A (강의용 PPT 처럼 질문 Q 먼저 → 대답 A) */
  .qa-card{border:3px solid #DCE8FF;border-radius:20px;padding:14px 16px;margin-bottom:12px;background:#F7FAFF}
  .qline,.aline{display:flex;align-items:center;gap:12px}
  .aline{margin-top:10px;padding-top:10px;border-top:2px dashed #DCE8FF}
  .tag{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:1em}
  .tag.q{background:var(--sky)}.tag.a{background:var(--mint)}
  .qa-card .t{flex:1;min-width:0;font-weight:800;font-size:1.2em;line-height:1.3}
  .qa-card .t small{display:block;color:var(--muted);font-weight:600;font-size:.66em;margin-top:2px}
  .reveal{margin-top:10px;width:100%;border:3px dashed #A9C6FF;background:#fff;border-radius:16px;padding:14px;font-weight:800;color:var(--sky2);cursor:pointer;font-size:.92em}
  .reveal:active{transform:translateY(2px)}

  .stage{display:grid;grid-template-columns:1fr 1.1fr;gap:16px;align-items:start}
  @media (max-width:820px){ .stage{grid-template-columns:1fr} }
  .bigsay{border-radius:var(--r);background:#F5F9FF;border:3px solid #DCE8FF;padding:20px;text-align:center}
  .bigsay .pic{font-size:3.6em;line-height:1.2}
  .bigsay .s{font-weight:800;font-size:1.5em;margin:8px 0 4px;line-height:1.3}
  .bigsay .k{color:var(--muted);font-weight:600}
  .bigsay .qs{color:var(--sky2);font-weight:700;font-size:.92em;min-height:1.3em}
  .bigsay .as{color:var(--mint2);font-weight:700;font-size:.92em;min-height:1.3em;margin-top:2px}
  .bigsay .ctrl{display:flex;gap:16px;justify-content:center;margin-top:14px}
  .bigsay .ctrl .mic,.bigsay .ctrl .play,.bigsay .ctrl .mine{width:74px;height:74px;font-size:1.7em}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .wcard{border:3px solid var(--line);border-bottom-width:6px;background:#fff;border-radius:18px;padding:10px 8px;cursor:pointer;text-align:center;position:relative}
  .wcard:active{transform:translateY(3px);border-bottom-width:3px}
  .wcard .e{font-size:2.1em}
  .wcard .n{font-weight:800;font-size:.92em;margin-top:2px}
  .wcard .h{font-size:.7em;color:var(--muted);font-weight:600}
  .wcard.sel{border-color:var(--sky);background:#F3F8FF}
  .wcard.ok{border-color:#A9E8C6}
  .wcard.ok::after{content:"✔";position:absolute;top:4px;right:9px;color:var(--mint);font-weight:800}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
  .dots i{width:16px;height:16px;border-radius:50%;background:#E1E5F1}
  .dots i.on{background:var(--sun)}
  .dots i.no{background:#FFC7CB}
  .qbubble{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
  .qbubble .who{font-size:2.2em;line-height:1;flex:none}
  .qbubble .b{background:#fff;border:3px solid var(--line);border-radius:20px;border-top-left-radius:6px;padding:12px 16px;font-weight:800;font-size:1.15em;line-height:1.35}
  .qbubble.me{flex-direction:row-reverse}
  .qbubble.me .b{background:#F3F8FF;border-color:#DCE8FF;border-top-left-radius:20px;border-top-right-radius:6px}
  .model{margin-top:10px;background:#EFFBF4;border:2px solid #A9E8C6;border-radius:16px;padding:10px 14px;font-weight:800;font-size:1.05em;text-align:left}
  .model small{display:block;color:var(--mint2);font-size:.72em;font-weight:700}
  .snow .say .s{font-size:1.1em}
  .stars{font-size:3em;letter-spacing:8px;text-align:center}
  .stars .st.dim{opacity:.18}
  .tip{background:#FFF8DF;border:2px dashed #FFD98A;border-radius:16px;padding:12px 16px;font-size:.85em;margin-top:12px;font-weight:600}
  .navrow{display:flex;gap:12px;margin-top:10px}
  .navrow .btn{flex:1}
  .finish{text-align:center}
  .finish h2{justify-content:center;margin-top:8px}
  .gain{display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
  .gain span{background:#FFF4CC;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.9em}
  .gain span.fire{background:#FFE8DD;color:#b8420f}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1F2A44;color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;z-index:9;max-width:90%;text-align:center}

  /* ───────── 🏁 Pass Test ───────── */
  .ptlist{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .ptrow{display:flex;gap:12px;align-items:center;background:#F6F4FF;border-radius:14px;padding:10px 14px;font-weight:700}
  .ptrow .l{color:var(--grape2);font-weight:800;min-width:76px}

 you?"},{"who":"A","en":"Yes, I have! I saw one in Ulsan."},{"who":"B","en":"Wow, lucky you!"}],"tip":"have + 과거분사(been, eaten, seen). 대답 뒤 과거 문장(I went there ~)으로 이어 말하게 하세요."},{"id":"A02","no":122,"label":"Level 122","unit":"U01","pattern":"I've ___ before.","ko":"전에 ~해 본 적 있어.","tpl":"I've {w} before.","words":[{"en":"been to Japan","ko":"일본에 가 보다","pic":"🗾"},{"en":"seen this movie","ko":"이 영화를 보다","pic":"🎬"},{"en":"tried kimchi pizza","ko":"김치 피자를 먹어 보다","pic":"🍕"},{"en":"played this game","ko":"이 게임을 해 보다","pic":"🎮"},{"en":"read this book","ko":"이 책을 읽다","pic":"📖"},{"en":"heard this song","ko":"이 노래를 듣다","pic":"🎵"},{"en":"met her","ko":"그녀를 만나다","pic":"👋"},{"en":"made pancakes","ko":"팬케이크를 만들다","pic":"🥞"}],"examples":[{"en":"I've been to Japan before.","ko":"일본에 가 보다"},{"en":"I've seen this movie before.","ko":"이 영화를 보다"},{"en":"I've tried kimchi pizza before.","ko":"김치 피자를 먹어 보다"}],"q":"Is this new for you?","a":"No. I've {w} before.","snow":["I've seen it.","I've seen this movie before.","I've seen this movie before. It's really funny!"],"talk":[{"who":"A","en":"Let's play this new game!"},{"who":"B","en":"I've played it before. It's so much fun."},{"who":"A","en":"Great! You can teach me."}],"tip":"I've = I have. read의 과거분사는 read[레드]로 발음이 바뀌어요."},{"id":"A03","no":123,"label":"Level 123","unit":"U01","pattern":"I've never ___.","ko":"한 번도 ~해 본 적 없어.","tpl":"I've never {w}.","words":[{"en":"been abroad","ko":"외국에 가 보다","pic":"🌐"},{"en":"seen snow","ko":"눈을 보다","pic":"❄️"},{"en":"ridden a roller coaster","ko":"롤러코스터를 타다","pic":"🎢"},{"en":"cooked dinner","ko":"저녁을 요리하다","pic":"🍳"},{"en":"lost my phone","ko":"휴대폰을 잃어버리다","pic":"📱","q":"Have you ever lost your phone?"},{"en":"broken a bone","ko":"뼈가 부러지다","pic":"🦴"},{"en":"been late for school","ko":"학교에 지각하다","pic":"⏰"},{"en":"played golf","ko":"골프를 치다","pic":"⛳"}],"examples":[{"en":"I've never been abroad.","ko":"외국에 가 보다"},{"en":"I've never seen snow.","ko":"눈을 보다"},{"en":"I've never ridden a roller coaster.","ko":"롤러코스터를 타다"}],"q":"Have you ever {w}?","a":"No. I've never {w}.","snow":["I've never been abroad.","I've never been abroad, but I want to go.","I've never been abroad, but I really want to visit Canada."],"talk":[{"who":"A","en":"Have you ever ridden a roller coaster?"},{"who":"B","en":"No, I've never ridden one. I'm scared!"},{"who":"A","en":"It's fun. Let's try it together."}],"tip":"never는 have와 과거분사 사이에. '경험 빙고' 게임(Have you ever ~?)으로 반 친구 인터뷰."},{"id":"A04","no":124,"label":"Level 124","unit":"U01","pattern":"Have you ___ yet? – Yes, I've already ___.","ko":"벌써 ~했어? – 응, 이미 ~했어.","tpl":"Have you {w} yet?","words":[{"en":"finished the homework","ko":"숙제를 끝내다","pic":"📝"},{"en":"eaten lunch","ko":"점심을 먹다","pic":"🍱"},{"en":"cleaned the room","ko":"방을 치우다","pic":"🧹"},{"en":"read the book","ko":"그 책을 읽다","pic":"📕"},{"en":"packed the bag","ko":"가방을 싸다","pic":"🎒"},{"en":"watched the video","ko":"그 영상을 보다","pic":"📺"},{"en":"bought the tickets","ko":"표를 사다","pic":"🎟️"},{"en":"sent the email","ko":"이메일을 보내다","pic":"📧"}],"examples":[{"en":"Have you finished the homework yet?","ko":"숙제를 끝내다"},{"en":"Have you eaten lunch yet?","ko":"점심을 먹다"},{"en":"Have you cleaned the room yet?","ko":"방을 치우다"}],"q":"Have you {w} yet?","a":"Yes, I've already {w}. / No, not yet.","snow":["Have you eaten?","Have you eaten lunch yet?","It's one o'clock. Have you eaten lunch yet?"],"talk":[{"who":"A","en":"Have you finished the homework yet?"},{"who":"B","en":"Yes, I've already finished it."},{"who":"A","en":"Wow, you're fast! I haven't started yet."}],"tip":"yet은 질문·부정문 끝(아직), already는 긍정문 가운데(이미)."},{"id":"A05","no":125,"label":"Level 125","unit":"U01","pattern":"How long have you ___? – For / Since ___.","ko":"얼마나 오래 ~해 왔어?","tpl":"I've {w}.","words":[{"en":"lived here for five years","ko":"여기 5년째 살고 있어","pic":"🏠","q":"How long have you lived here?"},{"en":"studied English since I was seven","ko":"7살 때부터 영어를 공부했어","pic":"📚","q":"How long have you studied English?"},{"en":"known her for three years","ko":"그녀를 3년째 알고 지내","pic":"👭","q":"How long have you known her?"},{"en":"had this dog for two years","ko":"이 개를 2년째 키우고 있어","pic":"🐕","q":"How long have you had your dog?"},{"en":"played the piano since 2023","ko":"2023년부터 피아노를 쳤어","pic":"🎹","q":"How long have you played the piano?"},{"en":"been in this class since March","ko":"3월부터 이 반에 있었어","pic":"🏫","q":"How long have you been in this class?"}],"examples":[{"en":"I've lived here for five years.","ko":"여기 5년째 살고 있어"},{"en":"I've studied English since I was seven.","ko":"7살 때부터 영어를 공부했어"},{"en":"I've known her for three years.","ko":"그녀를 3년째 알고 지내"}],"q":"How long have you lived here?","a":"I've {w}.","snow":["I've lived here for five years.","I've lived in this town for five years.","I've lived in this town for five years, and I love it here."],"talk":[{"who":"A","en":"How long have you known Mina?"},{"who":"B","en":"I've known her since first grade."},{"who":"A","en":"So you're best friends!"}],"tip":"for + 기간(five years), since + 시작 시점(2023, March, I was seven)."},{"id":"A06","no":126,"label":"Level 126","unit":"U02","pattern":"If ___, I'll ___.","ko":"만약 ~하면, 나는 ~할 거야.","tpl":"If {w}.","words":[{"en":"it rains, I'll stay home","ko":"비가 오면 집에 있을 거야","pic":"🌧️"},{"en":"it's sunny, I'll go hiking","ko":"맑으면 등산 갈 거야","pic":"🥾"},{"en":"I finish early, I'll play games","ko":"일찍 끝나면 게임할 거야","pic":"🎮"},{"en":"you're hungry, I'll make a sandwich","ko":"배고프면 샌드위치 만들어 줄게","pic":"🥪"},{"en":"I get a good grade, I'll be so happy","ko":"좋은 점수 받으면 정말 기쁠 거야","pic":"💯"},{"en":"you need help, I'll help you","ko":"도움이 필요하면 도와줄게","pic":"🤝"}],"examples":[{"en":"If it rains, I'll stay home.","ko":"비가 오면 집에 있을 거야"},{"en":"If it's sunny, I'll go hiking.","ko":"맑으면 등산 갈 거야"},{"en":"If I finish early, I'll play games.","ko":"일찍 끝나면 게임할 거야"}],"q":"Tell me your plan.","a":"If {w}.","snow":["If it rains, I'll stay home.","If it rains tomorrow, I'll stay home.","If it rains tomorrow, I'll stay home and read a book."],"talk":[{"who":"A","en":"What will you do this Saturday?"},{"who":"B","en":"If it's sunny, I'll go to the beach."},{"who":"A","en":"And if it rains?"},{"who":"B","en":"Then I'll watch movies at home."}],"tip":"if 문장은 현재형(rains), 뒤 문장은 will. If it will rain (X)."},{"id":"A07","no":127,"label":"Level 127","unit":"U02","pattern":"What will you do if ___?","ko":"만약 ~하면 뭐 할 거야?","tpl":"What will you do if {w}?","words":[{"en":"it snows tomorrow","ko":"내일 눈이 오면","pic":"☃️","q":"What will you do if it snows tomorrow?","a":"I'll make a snowman."},{"en":"you get lost","ko":"길을 잃으면","pic":"🧭","q":"What will you do if you get lost?","a":"I'll ask a police officer for help."},{"en":"you're late for class","ko":"수업에 늦으면","pic":"⏰","q":"What will you do if you're late for class?","a":"I'll say sorry to the teacher."},{"en":"you lose your phone","ko":"휴대폰을 잃어버리면","pic":"📱","q":"What will you do if you lose your phone?","a":"I'll go to the lost and found."},{"en":"it's too hot","ko":"너무 더우면","pic":"🥵","q":"What will you do if it's too hot?","a":"I'll go swimming."},{"en":"you have free time","ko":"자유 시간이 있으면","pic":"🕹️","q":"What will you do if you have free time?","a":"I'll draw comics."}],"examples":[{"en":"What will you do if it snows tomorrow?","ko":"내일 눈이 오면"},{"en":"What will you do if you get lost?","ko":"길을 잃으면"},{"en":"What will you do if you're late for class?","ko":"수업에 늦으면"}],"q":"What will you do if {w}?","a":"I'll make a snowman.","snow":["What will you do?","What will you do if it snows?","What will you do if it snows a lot tomorrow?"],"talk":[{"who":"A","en":"What will you do if you get lost?"},{"who":"B","en":"I'll call my mom right away."},{"who":"A","en":"That's smart."}],"tip":"안전 교육과 연결하세요: 길을 잃으면? 불이 나면? 영어로 대처법 말하기."},{"id":"A08","no":128,"label":"Level 128","unit":"U02","pattern":"If I were ___, I would ___.","ko":"만약 내가 ~라면, ~할 텐데.(상상)","tpl":"If I were {w}.","words":[{"en":"a bird, I would fly in the sky","ko":"새라면 하늘을 날 텐데","pic":"🐦"},{"en":"a teacher, I would give no homework","ko":"선생님이라면 숙제를 안 낼 텐데","pic":"🧑‍🏫"},{"en":"rich, I would help poor people","ko":"부자라면 가난한 사람을 도울 텐데","pic":"💰"},{"en":"invisible, I would surprise my friends","ko":"투명인간이라면 친구들을 놀래 줄 텐데","pic":"👻"},{"en":"the president, I would build more parks","ko":"대통령이라면 공원을 더 만들 텐데","pic":"🏞️"},{"en":"a doctor, I would help sick children","ko":"의사라면 아픈 아이들을 도울 텐데","pic":"🧑‍⚕️"}],"examples":[{"en":"If I were a bird, I would fly in the sky.","ko":"새라면 하늘을 날 텐데"},{"en":"If I were a teacher, I would give no homework.","ko":"선생님이라면 숙제를 안 낼 텐데"},{"en":"If I were rich, I would help poor people.","ko":"부자라면 가난한 사람을 도울 텐데"}],"q":"Imagine! What would you do?","a":"If I were {w}.","snow":["If I were a bird, I would fly.","If I were a bird, I would fly in the sky.","If I were a bird, I would fly over the sea to visit my grandma."],"talk":[{"who":"A","en":"If you were a teacher, what would you do?"},{"who":"B","en":"If I were a teacher, I would give no homework!"},{"who":"A","en":"Ha ha! Everyone would love you."}],"tip":"상상할 때는 be동사를 were로(I was보다 were가 표준). 재미있는 상상 발표로 진행하세요."},{"id":"A09","no":129,"label":"Level 129","unit":"U02","pattern":"What would you do if you ___?","ko":"만약 ~라면 뭘 할 거야?(상상)","tpl":"What would you do if you {w}?","words":[{"en":"had a million won","ko":"백만 원이 있다면","pic":"💵","q":"What would you do if you had a million won?","a":"I would buy a new computer."},{"en":"could fly","ko":"날 수 있다면","pic":"🦸","q":"What would you do if you could fly?","a":"I would fly to Paris."},{"en":"met an alien","ko":"외계인을 만난다면","pic":"👽","q":"What would you do if you met an alien?","a":"I would say hello and take a picture."},{"en":"found a wallet","ko":"지갑을 줍는다면","pic":"👛","q":"What would you do if you found a wallet?","a":"I would take it to the police station."},{"en":"were a superhero","ko":"슈퍼히어로라면","pic":"🦸‍♀️","q":"What would you do if you were a superhero?","a":"I would save people."},{"en":"could go anywhere","ko":"어디든 갈 수 있다면","pic":"🗺️","q":"What would you do if y ke to talk about {w}.","snow":["I'd like to talk about my hero.","Today, I'd like to talk about my hero.","Good morning, everyone. Today, I'd like to talk about my hero, my grandfather."],"talk":[{"who":"A","en":"Good morning, everyone. Today, I'd like to talk about my summer vacation."},{"who":"A","en":"I went to Jeju Island with my family."},{"who":"A","en":"It was the best trip ever!"}],"tip":"발표 주제를 알리는 문장. Today를 앞에 붙이면 자연스러워요."},{"id":"A58","no":178,"label":"Level 178","unit":"U12","pattern":"There are three reasons. First, ___.","ko":"이유가 세 가지 있어요. 첫째, ~.","tpl":"First, {w}.","words":[{"en":"it's good for our health","ko":"건강에 좋아요","pic":"💪"},{"en":"it saves money","ko":"돈이 절약돼요","pic":"💰"},{"en":"it's fun to do with friends","ko":"친구와 하면 재미있어요","pic":"🧑‍🤝‍🧑"},{"en":"we can learn new things","ko":"새로운 것을 배울 수 있어요","pic":"💡"},{"en":"it helps the environment","ko":"환경에 도움이 돼요","pic":"🌍"},{"en":"it makes people happy","ko":"사람들을 행복하게 해요","pic":"😊"}],"examples":[{"en":"First, it's good for our health.","ko":"건강에 좋아요"},{"en":"First, it saves money.","ko":"돈이 절약돼요"},{"en":"First, it's fun to do with friends.","ko":"친구와 하면 재미있어요"}],"q":"Why do you think so?","a":"There are three reasons. First, {w}.","snow":["First, it's good for our health.","There are three reasons. First, it's good for our health.","There are three reasons. First, it's good for our health. Second, it saves money. Third, it helps the environment."],"talk":[{"who":"A","en":"Why do you like reading?"},{"who":"B","en":"There are three reasons. First, it's fun. Second, I can learn new words. Third, it helps me sleep!"}],"tip":"First → Second → Third. 논리적으로 말하기의 기본 틀이에요."},{"id":"A59","no":179,"label":"Level 179","unit":"U12","pattern":"For example, ___.","ko":"예를 들어, ~.","tpl":"For example, {w}.","words":[{"en":"we can ride bikes instead of cars","ko":"차 대신 자전거를 탈 수 있어요","pic":"🚲"},{"en":"dogs can help blind people","ko":"개는 시각장애인을 도울 수 있어요","pic":"🦮"},{"en":"I read before bed every day","ko":"저는 매일 자 lk":[{"who":"A","en":"In conclusion, we should protect animals."},{"who":"A","en":"Thank you for listening."},{"who":"B","en":"(clap clap) Great job!"}],"tip":"고급편 졸업 패턴! U12의 다섯 패턴을 모아 1분 발표를 완성해 녹음해 보세요."}]} };
/* Q&A 규칙 — 강의용 PPT(ppt/qa.js)와 똑같은 규칙으로 질문(Q)·대답(A)을 만듭니다 */
var QA = (function(){ var module = { exports: {} };
// 패턴 Q&A 만들기 도우미 — make_ppt.js 에서 사용 (질문 Q 먼저 → 대답 A)
const fixArticle = t => t.replace(/\b([Aa]) (?=(?!uni|use|usu|eu|one\b|once)[aeiouAEIOU]|hour|honest)/g, '$1n ');
const fill = (tpl, w) => fixArticle(tpl.split('{w}').join(w)).replace(/\.\.(?=\s|$)/g, '.');   // ten a.m.. → ten a.m.
const blank = s => s.split('{w}').join('___');
const norm = s => s.replace(/___ing/g, '___').replace(/[.!?\s]+$/, '').trim().toLowerCase();
const pk = p => (/^[TR]\d/.test(p.id || '') ? p.id[0] : '') + p.no;   // 여행편(T01~)·실전편(R01~)은 번호가 초급편과 겹치므로 보정 규칙 열쇠를 따로 (T1, R1 …)

// 단어마다 질문이 달라지는데 데이터의 기본 질문이 한 단어에만 맞는 패턴 → 질문을 단어에 맞춤
const QFN = {
  30: w => `How many ${w.en.split(' ').pop()} are there?`,
  57: w => w.en === 'birthday' ? "It's my birthday today!" : w.en === 'New Year' ? "It's New Year's Day today!" : `It's ${w.en} today!`,
};
const QA_FIX = {   // [패턴 번호, 단어] → 질문 (비교·최상급 문장 단어)
  '91|A cheetah is faster than a horse': 'Which is faster, a cheetah or a horse?',
  '91|Today is colder than yesterday': 'Which is colder, today or yesterday?',
  '91|Summer is hotter than spring': 'Which is hotter, summer or spring?',
  '92|Mt. Everest is the highest mountain': 'What is the highest mountain?',
  '92|My grandpa is the oldest in my family': 'Who is the oldest in your family?',
  '92|Jiwoo is the tallest in my class': 'Who is the tallest in your class?',
  '93|This book is more interesting than that one': 'Which is more interesting, this book or that one?',
  '93|Cartoons are more fun than the news': 'Which are more fun, cartoons or the news?',
  '93|A diamond is more expensive than gold': 'Which is more expensive, a diamond or gold?',
  '133|First, I got up and washed my face': 'What did you do this morning?',
  // 2026-10-27 보완: 문장 단어(비교·최상급)마다 질문을 맞춤 — 예문 ①의 Q와 카드 ②의 Q가 대답과 어긋나지 않게
  '91|My dad is taller than me': 'Who is taller, you or your dad?',
  '91|A train is longer than a bus': 'Which is longer, a train or a bus?',
  '91|My sister is older than me': 'Who is older, you or your sister?',
  '91|A rock is heavier than a feather': 'Which is heavier, a rock or a feather?',
  '92|The cheetah is the fastest land animal': 'What is the fastest land animal?',
  '92|Winter is the coldest season': 'What is the coldest season?',
  '92|This is the best day ever': 'How is your day today?',
  '92|The Nile is the longest river': 'What is the longest river?',
  '93|Soccer is more exciting than baseball': 'Which is more exciting, soccer or baseball?',
  '93|Science is more difficult than art': 'Which is more difficult, science or art?',
  '93|Health is more important than money': 'Which is more important, health or money?',
  '93|A tiger is more dangerous than a cat': 'Which is more dangerous, a tiger or a cat?',
};
const AFN = {
  49: w => /s$/.test(w.en) && w.en !== 'hair' ? `(만지면서) These are my ${w.en}.` : `(만지면서) This is my ${w.en}.`,
};
const PATTERN_FIX = { 58: { q: "What's this?", a: 'Here is a ___ for you.' } };

/** 패턴 단위 Q·A (빈칸 ___). qType = 배우는 패턴이 질문 쪽 · koOn = 우리말 뜻을 붙일 쪽 */
function qaPattern(p) {
  if (PATTERN_FIX[pk(p)]) return Object.assign({ qType: false, koOn: 'a' }, PATTERN_FIX[pk(p)]);
  const P = p.pattern.trim(), Q = blank(p.q).trim(), A = blank(p.a).trim();
  const i = P.indexOf(' – ');
  if (i > 0) {                                   // "질문 – 대답" 패턴
    let a = P.slice(i + 3).trim();
    if (/^_+[.!]?$/.test(a)) a = A;              // "How many ___? – ___." → 데이터의 대답 예
    return { q: P.slice(0, i).trim(), a, qType: false, koOn: 'a' };
  }
  const nq = norm(Q), np = norm(P);
  if (nq === np || (/\?$/.test(P) && /\?$/.test(Q) && np.startsWith(nq) && nq.includes('___')))
    return { q: P, a: A, qType: true, koOn: 'q' };   // 패턴이 곧 질문 (Can I have ___? 등)
  const a = (A.endsWith(P) && A.length > P.length) ? A : P;   // "Bye! See you ___!"처럼 대답이 패턴을 품으면 대답 쪽
  return { q: Q, a, qType: false, koOn: 'a' };
}

/** 단어 1개로 만든 실제 Q·A. wordInQ = 단어가 질문에 들어감(→ Pass Test에서는 질문 틀 ___ 만 보여 줌) */
function qaWord(p, w) {
  const key = pk(p) + '|' + w.en;
  const q = QA_FIX[key] || w.q || (QFN[pk(p)] ? QFN[pk(p)](w) : fill(p.q, w.en));
  let a;
  if (w.a) a = w.a;
  else if (AFN[pk(p)]) a = AFN[pk(p)](w);
  else if (p.a.includes('{w}')) a = fill(p.a, w.en);
  else if (p.tpl.trim() === '{w}.') a = fill(p.tpl, w.en);   // 문장 단어(비교 문장 등)는 그 문장이 대답
  else a = p.a;
  const wordInQ = !w.q && !QA_FIX[key] && !QFN[pk(p)] && p.q.includes('{w}');
  return { q, a, wordInQ, frameQ: wordInQ ? blank(p.q) : q };
}

/** Pass Test 에 쓸 단어(그림·우리말 단서) */
const PASS_WORD = { 60: 'the best' };   // "I did it!"에는 funny보다 the best가 자연스러움
function passWord(p) { return (PASS_WORD[pk(p)] && p.words.find(w => w.en === PASS_WORD[pk(p)])) || p.words[Math.min(3, p.words.length - 1)]; }

/* ===================== 🔈 무료 기본 점검 (Azure 없이 태블릿에서) =====================

async function decodeBlob(blob){
  var buf = await blob.arrayBuffer();
  var AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
  try { return await new Promise(function(res, rej){ var p = ctx.decodeAudioData(buf, res, rej); if (p && p.then) p.then(res, rej); }); }
  finally { try { ctx.close(); } catch(e){} }
}
function soundStats(dec){
  var ch = dec.numberOfChannels, len = dec.length, sr = dec.sampleRate, fr = Math.max(1, Math.round(sr * 0.02)), skip = Math.round(sr * 0.12), data = [];
  for (var c = 0; c < ch; c++) data.push(dec.getChannelData(c));

    var sum = 0;
    for (var j = i; j < i + fr; j++) { var v = 0; for (var c2 = 0; c2 < ch; c2++) v += data[c2][j]; v /= ch; sum += v * v; }
    dbs.push(10 * Math.log10(sum / fr + 1e-12));

  if (!dbs.length) return { dur: dur, voiced: 0, peak: -120, floor: -120, level: 'silent' };
  var sorted = dbs.slice().sort(function(a, b){ return a - b; }), floor = sorted[Math.floor(sorted.length * 0.1)], peak = sorted[sorted.length - 1];
  var th = Math.max(-55, floor + 12), voiced = Math.round(dbs.filter(function(d){ return d > th; }).length * 0.02 * 10) / 10;

async function toWav16k(blob){ return wavFromDecoded(await decodeBlob(blob)); }
function wavFromDecoded(dec){
  var ch = dec.numberOfChannels, len = dec.length, mono = new Float32Array(len);

/** 녹음 1개 점검 — ① 태블릿에서 소리 크기·말한 시간(무료, 바로) → 소리가 없으면 다시

async function judge(blob, text, step, resultEl, onScore){

    cur.silentRun = (cur.silentRun || 0) + 1;

  }

    var c0 = cur, pid = cur.p.label;
    (async function(){
      try {
        var wav = ck.dec ? wavFromDecoded(ck.dec) : await toWav16k(blob);
        var r = await post({ action:'practice', cls: me.cls, name: me.name, code: me.code, pid: pid, step: step, text: text, audio: await b64(wav) }, 30000);

/* ③ 묻고 답하기 — PPT와 같은 2문제. Sunny가 묻고 내가 대답 → 모범 대답(A). 패턴이 질문이면 내가 그림을 보고 묻고 → Sunny가 대답 */

  box.insertAdjacentHTML('beforeend', '<p class="muted" style="margin:0 0 12px">' + (asks ? '🙋 그림을 보고 <b>내가 질문</b>해요 → Sunny가 대답해요.' : '🔊 Sunny의 질문을 듣고 🎤 영어로 대답해요. 그림을 보고 대답해도 좋아요.') + '</p><div id="qaBox"></div>');
  box.insertAdjacentHTML('beforeend', navRow(false));

    if (!asks) html =
      '<div class="qbubble"><div class="who">' + sunny('happy', 54) + '</div><div class="b en">' + esc(t.q) + ' <button class="play sm" id="qaPlay">🔊</button></div></div>' +
      '<div class="qbubble me"><div class="who">' + me.avatar + '</div><div class="b" style="font-size:1em"><span style="font-size:2em;vertical-align:middle">' + w.pic + '</span> <span class="muted">' + esc(w.ko) + '</span></div></div>';
    else html =
      '<div class="qbubble me"><div class="who">' + me.avatar + '</div><div class="b"><span style="font-size:2em;vertical-align:middle">' + w.pic + '</span> <span class="muted" style="font-size:.8em">' + esc(w.ko) + '</span><div class="en" style="margin-top:4px">🙋 ' + blankHtml(t.frameQ) + '</div></div></div>';
    html += '<div class="bigsay" style="padding:16px"><div class="ctrl" style="margin-top:0"><button class="mic" id="qaMic">🎤</button><button class="mine" id="qaMine" disabled>🎧</button><button class="play" id="qaHint" title="힌트">💡</button></div>' +

    (passNow ? '<div style="margin:14px 0 4px"><button class="btn purple wide" onclick="openPass(' + k + ')">🏁 ' + unitLabel(k) + ' Pass Test 도전! (5개 Level 묻고 답하기)</button></div>' : '') +

    '<div class="muted sm" style="font-weight:700;margin-bottom:8px">1️⃣ 연습할 패턴을 골라요</div><div class="grid" id="drPick"></div>' +
    '<div class="muted sm" style="font-weight:700;margin:16px 0 8px">2️⃣ 몇 번 따라 말할까요?</div><div class="row" id="drN"></div>' +
    '<div class="navrow" style="margin-top:18px"><button class="btn gray" onclick="renderHome()">🏠 홈으로</button><button class="btn" id="drStart" style="flex:2">▶ 시작!</button></div>';
  function draw(){
    $('drPick').innerHTML = cands.map(function(c){ return '<button class="tile' + (c === sel ? ' sel' : '') + '"><small style="margin:0 0 4px">Level ' + c.no + (c === c0 && !prog.done[c.id] ? ' · 오늘의 패턴' : ' · 배운 패턴') + '</small><span class="en" style="font-size:.95em">' + esc(c.pattern) + '</span><small>' + esc(c.ko) + '</small></button>'; }).join('');
    $('drPick').querySelectorAll('.tile').forEach(function(b, i){ b.onclick = function(){ sel = cands[i]; draw(); }; });
    $('drN').innerHTML = [6, 12, 18].map(function(k){ return '<button class="btn ' + (k === n ? 'blue' : 'gray') + '">' + k + '번 <small style="font-weight:600;opacity:.8">약 ' + Math.round(k / 3) + '분</small></button>'; }).join('');
    $('drN').querySelectorAll('.btn').forEach(function(b, i){ b.onclick = function(){ n = [6, 12, 18][i]; draw(); }; });
  }
  draw();
  $('drStart').onclick = function(){ startDrill(sel, n); };
  show('sDrill');
}
async function startDrill(p, n){
  if (!await openMic()) return;
  prefetchUnit(p);
  cur = { p:p, P: QA.qaPattern(p), step:0, tries:0, scores:[], said:{}, review:true, recs:{ n:0, ok:0, silent:0, sec:0 } };   // judge() 가 쓰는 상태
  D = { p:p, n:n, i:0, sents: p.examples.map(function(e){ return e.en; }), scores:[], said:0, silent:0, stop:false };
  $('sDrill').innerHTML = '<div class="lhead"><div class="bar" style="flex:1"><i id="drBar" style="width:0"></i></div><span class="timer" id="drCnt">0 / ' + n + '</span></div>' +
    '<div class="learn"><aside class="card lside">' + sunny('happy', 110, true) + '<div><div class="muted sm" style="font-weight:700">Level ' + p.no + ' · 반복 연습</div><div class="pat-title en">' + esc(p.pattern) + '</div><div class="pat-ko">' + esc(p.ko) + '</div></div><div class="bubble-sun" id="sunSay">잘 듣고 똑같이 따라 말해 봐!</div></aside>' +
    '<div class="card lmain"><div class="bigsay"><div class="pic" id="drPic">🔊</div><div class="s en" id="drS"></div><div class="k" id="drK"></div>' +
      '<div class="ctrl"><button class="mic" id="drMic" style="width:96px;height:96px;font-size:2.3em" disabled>🎤</button></div><div class="dbar"><i id="drTime"></i></div>' +
      '<div class="result" id="drRes"><span class="muted">🔊 듣고 → 🎤에 불이 켜지면 따라 말해요</span></div></div>' +
    '<div class="navrow"><button class="btn gray" onclick="drillStop()">⏹ 그만하기</button></div></div></div>';
  show('sDrill'); setTimeout(drillLoop, 600);
}
function drillLoop(){
  if (!D || D.stop) return;
  if (D.i >= D.n) return drillEnd();
  var k = D.i % D.sents.length, s = D.sents[k], ex = D.p.examples[k], w = D.p.words[k] || D.p.words[0];
  $('drS').textContent = s; $('drK').textContent = ex ? ex.ko : ''; $('drPic').textContent = w.pic;
  $('drCnt').textContent = D.i + ' / ' + D.n; $('drBar').style.width = Math.round(100 * D.i / D.n) + '%';
  $('drRes').innerHTML = '<span class="muted">🔊 듣는 중…</span>'; $('drMic').disabled = true; $('drTime').style.transition = 'none'; $('drTime').style.width = '0';
  var once = false, my = D, go = function(){ if (once || D !== my || D.stop) return; once = true; drillRecord(s); };
  speak(s, go); setTimeout(go, 2500 + s.length * 90);
}
function drillRecord(s){
  var secs = Math.min(7, Math.max(3, Math.round(1.5 + s.split(' ').length * 0.6))), my = D;
  $('drMic').disabled = false; $('drRes').innerHTML = '<span style="color:var(--coral)">🎤 지금 따라 말해요!</span>';
  var bar = $('drTime'); bar.style.transition = 'none'; bar.style.width = '100%'; void bar.offsetWidth; bar.style.transition = 'width ' + secs + 's linear'; bar.style.width = '0%';
  var next = function(){ if (D === my && !D.stop) { D.i++; setTimeout(drillLoop, 800); } };
  record($('drMic'), secs, async function(blob){
    if (D !== my || D.stop) return;
    var r = await judge(blob, s, 'drill', $('drRes'), function(sc){ my.scores.push(sc.score); });
    if (r && r.silent) D.silent++; else D.said++;    // 소리가 안 들린 번은 횟수에 넣지 않아요
    next();
  }, function(){ if (D !== my) return; D.silent++; sunSay('소리가 안 들렸어. 조금 더 크게 말해 봐!'); next(); });
}
function drillStop(){ var d = D; if (d) d.stop = true; stopAll(); if (d && d.said + d.silent >= 3) drillEnd(d); else openDrill(d && d.p); }
function drillEnd(d){
  d = d || D; closeMic(); if (!d) return; d.stop = true;
  var avg = d.scores.length ? Math.round(d.scores.reduce(function(a, b){ return a + b; }, 0) / d.scores.length) : null;
  var key = d.p.id + '_' + today(), star = d.said >= 6 && !prog.drill[key];
  if (star) { prog.drill[key] = 1; prog.stars = (prog.stars || 0) + 1; saveLocal(); $('starChip').textContent = '⭐ ' + prog.stars; }
  // 별을 못 받아도(소리가 안 들려 6번이 안 된 경우 등) 기록은 보내요 → 선생님 앱 '목소리 확인'·요약 메일 '마이크 확인 필요'에 반영
  if (star || d.said + d.silent >= 3) sendRecord({ action:'drill', cls:me.cls, name:me.name, code:me.code, pid:String(d.p.no), star: !!star, n: d.said, silent: d.silent, avg: avg == null ? '' : avg });
  $('sDrill').innerHTML = '<div class="finish">' + sunny(d.said ? 'cheer' : 'think', 130) + '<h2>' + (d.said ? esc(me.name) + ', ' + d.said + '번 따라 말했어요! 🎉' : '🎧 소리가 잘 안 들렸어요') + '</h2>' +
    '<p class="en" style="font-weight:800;font-size:1.2em;margin:4px 0">' + esc(d.p.pattern) + '</p>' +
    '<div class="gain">' + (star ? '<span>⭐ +1</span>' : d.said >= 6 ? '<span class="muted">⭐ 오늘 이 패턴의 별은 이미 받았어요</span>' : '') + (avg != null ? '<span>🎯 평균 발음 ' + avg + '점</span>' : '') + '<span>🔁 ' + d.said + '회</span>' + (d.silent ? '<span class="fire">🔇 ' + d.silent + '번은 소리가 안 들렸어요</span>' : '') + '</div>' +
    '<p class="muted">' + (d.said >= 6 ? '반복하면 입에 붙어요. 내일 또 해 봐요!' : d.said ? '6번 이상 따라 말하면 별을 받아요.' : '헤드셋 마이크가 잘 꽂혔는지 선생님께 확인해 달라고 하고, 다시 해 봐요.') + '</p>' +
    '<div class="navrow" style="margin-top:16px"><button class="btn blue" onclick="openDrill(BYID[\'' + d.p.id + '\'])">🔁 한 번 더</button><button class="btn green" onclick="renderHome()">🏠 처음으로</button><button class="btn bye" onclick="bye()"><span>👋</span>끝내기</button></div></div>';
  sfx('win'); if (star) confetti(60);
  speak(d.said >= 6 ? 'Great practice! See you tomorrow!' : 'Nice try!');
  armIdle();
}

/* 화면이 꺼지거나 다른 앱으로 가면 녹음 정리 · 다시 돌아오면 서버와 진도 맞춤 */
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { if (isRecording()) mic.rec.stop(); return; }
  if (idleOK() && Date.now() - lastTouch > IDLE_MIN * 60000) { logout(); return; }   // 화면이 꺼져 있던 동안 오래 지났으면 다음 학생을 위해
  if (me.name && prog && onScreen('sHome') && Date.now() - SYNC.t0 > 60000) syncProgress();
});
init();

</script>
</body>
</html>
